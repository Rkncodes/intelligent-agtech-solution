{% extends 'layout.html' %} {% block body %}

<section class="hv-section-sm">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-xl-10">
        <div class="hv-page-header">
          <span class="hv-eyebrow">{{ _('Fertilizer Advisor') }}</span>
          <h1>{{ _('Your soil nutrient report') }}</h1>
        </div>

        <div class="hv-card mb-4">
          <div class="hv-card-body">
            <div class="fz-advice" id="fz-advice" data-action-label="{{ _('What to do') }}">{{ recommendation }}</div>
          </div>
        </div>

        <div class="hv-form-actions">
          <a href="{{ url_for('fertilizer_recommendation') }}" class="btn btn-success px-4">{{ _('Check another field') }}</a>
        </div>
      </div>
    </div>
  </div>
</section>

<script>
  /* Presentation only: group each nutrient's diagnosis with its actions and label the action list.
     The advice text itself comes unchanged from the server. */
  (function () {
    var root = document.getElementById("fz-advice");
    if (!root) return;
    var table = root.querySelector("table");
    if (table) {
      table.classList.add("hv-table");
      var wrap = document.createElement("div");
      wrap.className = "table-responsive fz-table";
      table.parentNode.insertBefore(wrap, table);
      wrap.appendChild(table);
    }
    var label = root.getAttribute("data-action-label");
    Array.prototype.slice.call(root.querySelectorAll("h4")).forEach(function (h) {
      var box = document.createElement("div");
      var m = /\bis (low|high)\b/.exec(h.textContent);
      box.className = "fz-issue" + (m ? " fz-" + m[1] : "");
      h.parentNode.insertBefore(box, h);
      var node = h;
      while (node && !(node !== h && (node.tagName === "H4" || (node.tagName === "P" && node.classList.contains("mt-4"))))) {
        var next = node.nextElementSibling;
        box.appendChild(node);
        node = next;
      }
      var list = box.querySelector("ul");
      if (list && label) {
        var tag = document.createElement("div");
        tag.className = "fz-action-label";
        tag.textContent = label;
        list.parentNode.insertBefore(tag, list);
      }
    });
  })();
</script>

{% endblock %}
